name: Release draft

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify tag, version, and commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bun run release:verify-tag --tag "$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          version="$(bun -e 'const p=await Bun.file("package.json").json(); process.stdout.write(p.version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  native-build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            uname: arm64
            file-arch: arm64
            macos: true
          - target: darwin-x64
            runner: macos-15-intel
            uname: x86_64
            file-arch: x86_64
            macos: true
          - target: linux-x64-baseline
            runner: ubuntu-24.04
            uname: x86_64
            file-arch: x86-64
            macos: false
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
            file-arch: aarch64
            macos: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.uname }}"
      - name: Build isolated executable
        shell: bash
        env:
          ASANA_CLI_BUILD_CANARY: asana-cli-release-secret-like-canary-59c2a34e
        run: |
          bun run build:target "${{ matrix.target }}"
          binary="dist/release/${{ matrix.target }}/asana-cli"
          if strings "$binary" | grep -F -- "$ASANA_CLI_BUILD_CANARY"; then
            echo "Build environment canary was embedded in $binary" >&2
            exit 1
          fi
      - name: Verify binary architecture
        shell: bash
        run: |
          description="$(file "dist/release/${{ matrix.target }}/asana-cli")"
          echo "$description"
          [[ "$description" == *"${{ matrix.file-arch }}"* ]]
      - name: Ad-hoc sign macOS executable
        if: matrix.macos
        shell: bash
        run: |
          binary="dist/release/${{ matrix.target }}/asana-cli"
          codesign --force --deep --sign - --timestamp=none \
            --entitlements config/macos-entitlements.plist "$binary"
          codesign --verify --deep --strict --verbose=2 "$binary"
      - run: bun run smoke:executable --binary "dist/release/${{ matrix.target }}/asana-cli"
      - name: Preserve executable mode and signature
        shell: bash
        run: |
          mkdir -p dist/raw
          tar -cf "dist/raw/${{ matrix.target }}.tar" \
            -C "dist/release/${{ matrix.target }}" asana-cli
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.target }}
          path: dist/raw/${{ matrix.target }}.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package:
    needs: [validate, native-build]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true
      - name: Validate and extract native artifacts
        shell: bash
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64-baseline linux-arm64; do
            archive="raw/${target}.tar"
            test -f "$archive"
            mapfile -t members < <(tar -tf "$archive")
            test "${#members[@]}" -eq 1
            test "${members[0]}" = "asana-cli"
            mkdir -p "release-input/$target"
            tar -xf "$archive" -C "release-input/$target"
            chmod 0755 "release-input/$target/asana-cli"
          done
      - name: Package archives and formula
        shell: bash
        run: |
          bun run package:release --input release-input --output release-assets \
            --version "${{ needs.validate.outputs.version }}"
          bun run formula:generate --checksums release-assets/SHA256SUMS \
            --output release-assets/asana-cli.rb \
            --version "${{ needs.validate.outputs.version }}" \
            --repository "${{ github.repository }}"
          ruby -c release-assets/asana-cli.rb
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  homebrew-install:
    needs: [validate, package]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            uname: arm64
          - runner: macos-15-intel
            uname: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: test "$(uname -m)" = "${{ matrix.uname }}"
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Install formula from current-run archives
        shell: bash
        run: |
          assets="$(pwd)/release-assets"
          bun run formula:generate --checksums release-assets/SHA256SUMS \
            --output "$RUNNER_TEMP/asana-cli.rb" \
            --version "${{ needs.validate.outputs.version }}" \
            --base-url "file://$assets"
          ruby -c "$RUNNER_TEMP/asana-cli.rb"
          brew install --formula "$RUNNER_TEMP/asana-cli.rb"
          brew test asana-cli
      - name: Remove test formula
        if: always()
        run: brew uninstall asana-cli || true

  release:
    needs: [validate, package, homebrew-install]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if existing="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$existing" != "true" ]; then
              echo "Release $tag is already published; refusing to modify it" >&2
              exit 1
            fi
            echo "Updating existing draft release $tag"
            gh release edit "$tag" --draft --title "asana-cli $tag" \
              --notes "Automated draft for explicit human verification."
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --draft --verify-tag \
              --title "asana-cli $tag" \
              --notes "Automated draft for explicit human verification."
          fi
